<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Book Delivery - Emerald Courier</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#e6e9e3",
                        "inverse-on-surface": "#eff2eb",
                        "secondary-fixed-dim": "#b2ceb5",
                        "tertiary-fixed": "#ffdadb",
                        "tertiary-container": "#6f2c35",
                        "surface-container-lowest": "#ffffff",
                        "inverse-surface": "#2e312d",
                        "outline": "#707970",
                        "on-tertiary-fixed": "#3d0511",
                        "on-primary-fixed": "#00210d",
                        "surface-dim": "#d8dbd5",
                        "on-surface": "#191d19",
                        "primary-fixed": "#adf2bc",
                        "on-secondary-container": "#516a56",
                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a",
                        "background": "#f8faf4",
                        "surface-container-highest": "#e0e3dd",
                        "primary-container": "#004d26",
                        "surface-container": "#ecefe8",
                        "inverse-primary": "#92d6a2",
                        "on-secondary-fixed-variant": "#344c39",
                        "on-primary-container": "#7abd8b",
                        "surface-container-low": "#f2f4ee",
                        "surface-variant": "#e0e3dd",
                        "primary-fixed-dim": "#92d6a2",
                        "on-secondary-fixed": "#082010",
                        "on-error": "#ffffff",
                        "surface": "#f8faf4",
                        "error-container": "#ffdad6",
                        "surface-bright": "#f8faf4",
                        "outline-variant": "#c0c9be",
                        "on-primary": "#ffffff",
                        "on-primary-fixed-variant": "#08522a",
                        "on-surface-variant": "#404941",
                        "tertiary-fixed-dim": "#ffb2b8",
                        "secondary": "#4b6450",
                        "primary": "#003418",
                        "on-background": "#191d19",
                        "secondary-fixed": "#cdead0",
                        "on-tertiary-container": "#f0959d",
                        "on-error-container": "#93000a",
                        "tertiary": "#531620",
                        "on-tertiary": "#ffffff",
                        "secondary-container": "#cdead0",
                        "on-tertiary-fixed-variant": "#753139",
                        "surface-tint": "#296b40"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .map-underlay {
            filter: grayscale(100%) contrast(90%) brightness(105%) opacity(0.4);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-50 bg-[#f8faf4] dark:bg-[#191d19]">
<div class="flex justify-between items-center px-6 py-4 w-full">
<div class="flex items-center gap-4">
<button class="text-[#003418] dark:text-[#f8faf4] hover:bg-[#e6e9e3] dark:hover:bg-[#2d322d] transition-colors p-2 rounded-full active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-['Manrope'] font-extrabold text-[#003418] dark:text-[#f8faf4] italic text-lg tracking-tight">Emerald Courier</h1>
</div>
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-outline-variant/30">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="Professional portrait of a male logistics manager with a friendly expression and clean studio lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDn24772XIxIfVzcfI6GHpJsa6vvBc1dEyKCjoIhE6ZE3RNrLqNED5dpYIpcRMmGlMqg40A_pMB6L1dud39A4uSf3YuF-d9Kunf_YkkrJjKIfb_gWUcPOw8X_0r_IzTJSxdw8y3NKbs0ulYa2_QsKjHQ3xI3DCK0wZ3zhosmyuBHyLXC3ChUbvH5OrqTaRKlqJYa8YBjE01bfxKwj90H9JIWWvbPXq9b03TjnGXCGXhctrH9nJe_-rYqzT_2G8bEf2Nh6wHkGVsBDU"/>
</div>
</div>
</header>
<main class="flex-grow relative flex flex-col items-center justify-start">
<!-- Map Underlay -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<img alt="City Map" class="w-full h-full object-cover map-underlay" data-alt="A clean minimalist map illustration of an urban city center with soft grey and white tones" data-location="London" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBz6K2WeoVq1bzDZWGlqSpJknHOuKqQObv-n2S3CAQcCccu9wy6DWX-DHbjXZQ9V8ZB5Vz5IghpVeKazeWIek8jwIhWfp3mLctuT1ShN44nbSWCqjkGhAAt15L6i0nByjS697EGu3bL5JvWDKl4zKdWufOkRIHmJQZIiJBnAbkMKyjD5qZw4-i9aQkaXaElhfTj0cuoYyzEVOpvtarJDTkb0LqZW7V0v4jvJvixLoL98s8XqlBKlFspF7NkjjDgKOd6nsWGTlsXQ-U"/>
</div>
<div class="relative z-10 w-full max-w-2xl px-6 py-8 md:py-12 flex flex-col gap-8">
<!-- Hero Heading -->
<div class="space-y-2">
<h2 class="font-headline font-extrabold text-3xl md:text-4xl text-primary tracking-tight">Set Your Route</h2>
<p class="text-on-surface-variant font-medium">Precision logistics starting from your doorstep.</p>
</div>
<!-- Main Input Canvas -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_24px_48px_-12px_rgba(0,52,24,0.08)] p-6 md:p-8 flex flex-col gap-6">
<!-- Address Section -->
<div class="flex flex-col gap-4">
<!-- Pickup -->
<div class="group">
<label class="block font-label font-semibold text-xs text-on-surface-variant uppercase tracking-widest mb-2 px-1">Pickup Location</label>
<div class="relative flex items-center">
<span class="absolute left-4 material-symbols-outlined text-primary" data-icon="location_on">location_on</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-low border-none rounded-xl focus:ring-1 focus:ring-primary focus:bg-surface-container-lowest transition-all placeholder:text-outline/60 text-on-surface" placeholder="Enter pickup address..." type="text"/>
</div>
</div>
<!-- Visual Connector -->
<div class="flex px-8 py-1">
<div class="w-0.5 h-6 bg-gradient-to-b from-primary/40 to-primary-container/20 rounded-full"></div>
</div>
<!-- Drop-off -->
<div class="group">
<label class="block font-label font-semibold text-xs text-on-surface-variant uppercase tracking-widest mb-2 px-1">Drop-off Destination</label>
<div class="relative flex items-center">
<span class="absolute left-4 material-symbols-outlined text-primary-container" data-icon="flag">flag</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-low border-none rounded-xl focus:ring-1 focus:ring-primary focus:bg-surface-container-lowest transition-all placeholder:text-outline/60 text-on-surface" placeholder="Where are we delivering to?" type="text"/>
</div>
</div>
</div>
<!-- AI Natural Language Assist -->
<div class="pt-4 border-t border-surface-container-high">
<div class="flex items-center justify-between mb-3 px-1">
<label class="font-label font-semibold text-xs text-on-surface-variant uppercase tracking-widest">Natural Language Assist</label>
<span class="flex items-center gap-1.5 px-2 py-0.5 bg-primary-container/10 rounded-full text-[10px] font-bold text-primary-container uppercase tracking-tighter">
<span class="material-symbols-outlined !text-sm" data-icon="auto_awesome" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
                            Smart Detect
                        </span>
</div>
<div class="relative">
<textarea class="w-full p-4 bg-surface-container-low border-none rounded-xl focus:ring-1 focus:ring-primary focus:bg-surface-container-lowest transition-all placeholder:text-outline/60 text-on-surface resize-none" placeholder="e.g., 'Take the fragile blue box from the front porch to the 5th floor library reception desk.'" rows="3"></textarea>
<div class="absolute bottom-3 right-3 text-[10px] text-outline font-medium">Describe your delivery context</div>
</div>
</div>
<!-- Quick Suggestions Chip Row -->
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 rounded-full bg-surface-container-high text-on-surface-variant text-xs font-semibold hover:bg-primary/5 transition-colors">Fragile Item</button>
<button class="px-4 py-2 rounded-full bg-surface-container-high text-on-surface-variant text-xs font-semibold hover:bg-primary/5 transition-colors">Residential Gate</button>
<button class="px-4 py-2 rounded-full bg-surface-container-high text-on-surface-variant text-xs font-semibold hover:bg-primary/5 transition-colors">Signature Required</button>
</div>
</div>
<!-- Primary Action -->
<button class="w-full py-5 bg-gradient-to-br from-primary to-primary-container text-white font-headline font-bold text-lg rounded-xl shadow-[0_12px_24px_-8px_rgba(0,52,24,0.3)] hover:brightness-110 active:scale-95 transition-all flex items-center justify-center gap-3">
                Continue to Booking
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</main>
<!-- BottomNavBar (Hidden on desktop via design system preference, but logic dictates display here for PWA) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-6 pt-3 bg-[#f8faf4]/80 dark:bg-[#191d19]/80 backdrop-blur-lg border-t border-[#c0c9be]/20 shadow-[0_-4px_24px_rgba(25,29,25,0.06)] z-50 rounded-t-2xl">
<div class="flex flex-col items-center justify-center bg-[#004d26] text-white rounded-xl py-2 px-4 transition-all active:opacity-80">
<span class="material-symbols-outlined" data-icon="local_shipping">local_shipping</span>
<span class="font-['Inter'] text-[11px] font-medium uppercase tracking-wider mt-1">Book</span>
</div>
<div class="flex flex-col items-center justify-center text-[#404941] dark:text-[#c0c9be] py-2 px-4 hover:bg-[#f2f4ee] dark:hover:bg-[#2d322d] transition-all active:opacity-80">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-['Inter'] text-[11px] font-medium uppercase tracking-wider mt-1">Activity</span>
</div>
<div class="flex flex-col items-center justify-center text-[#404941] dark:text-[#c0c9be] py-2 px-4 hover:bg-[#f2f4ee] dark:hover:bg-[#2d322d] transition-all active:opacity-80">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="font-['Inter'] text-[11px] font-medium uppercase tracking-wider mt-1">Wallet</span>
</div>
<div class="flex flex-col items-center justify-center text-[#404941] dark:text-[#c0c9be] py-2 px-4 hover:bg-[#f2f4ee] dark:hover:bg-[#2d322d] transition-all active:opacity-80">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
<span class="font-['Inter'] text-[11px] font-medium uppercase tracking-wider mt-1">Profile</span>
</div>
</nav>
<!-- Desktop Sidebar/Nav (Hidden on Mobile) -->
<div class="hidden md:flex fixed left-6 top-24 flex-col gap-6 z-40">
<div class="p-3 rounded-2xl bg-primary text-white shadow-lg cursor-pointer">
<span class="material-symbols-outlined" data-icon="add_location" style="font-variation-settings: 'FILL' 1;">add_location</span>
</div>
<div class="p-3 rounded-2xl bg-surface-container-lowest text-on-surface-variant hover:text-primary transition-colors cursor-pointer shadow-sm">
<span class="material-symbols-outlined" data-icon="schedule">schedule</span>
</div>
<div class="p-3 rounded-2xl bg-surface-container-lowest text-on-surface-variant hover:text-primary transition-colors cursor-pointer shadow-sm">
<span class="material-symbols-outlined" data-icon="star">star</span>
</div>
</div>
</body></html>
