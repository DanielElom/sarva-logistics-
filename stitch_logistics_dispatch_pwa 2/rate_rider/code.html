<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-high": "#e6e9e3",
                    "inverse-on-surface": "#eff2eb",
                    "secondary-fixed-dim": "#b2ceb5",
                    "tertiary-fixed": "#ffdadb",
                    "tertiary-container": "#6f2c35",
                    "surface-container-lowest": "#ffffff",
                    "inverse-surface": "#2e312d",
                    "outline": "#707970",
                    "on-tertiary-fixed": "#3d0511",
                    "on-primary-fixed": "#00210d",
                    "surface-dim": "#d8dbd5",
                    "on-surface": "#191d19",
                    "primary-fixed": "#adf2bc",
                    "on-secondary-container": "#516a56",
                    "on-secondary": "#ffffff",
                    "error": "#ba1a1a",
                    "background": "#f8faf4",
                    "surface-container-highest": "#e0e3dd",
                    "primary-container": "#004d26",
                    "surface-container": "#ecefe8",
                    "inverse-primary": "#92d6a2",
                    "on-secondary-fixed-variant": "#344c39",
                    "on-primary-container": "#7abd8b",
                    "surface-container-low": "#f2f4ee",
                    "surface-variant": "#e0e3dd",
                    "primary-fixed-dim": "#92d6a2",
                    "on-secondary-fixed": "#082010",
                    "on-error": "#ffffff",
                    "surface": "#f8faf4",
                    "error-container": "#ffdad6",
                    "surface-bright": "#f8faf4",
                    "outline-variant": "#c0c9be",
                    "on-primary": "#ffffff",
                    "on-primary-fixed-variant": "#08522a",
                    "on-surface-variant": "#404941",
                    "tertiary-fixed-dim": "#ffb2b8",
                    "secondary": "#4b6450",
                    "primary": "#003418",
                    "on-background": "#191d19",
                    "secondary-fixed": "#cdead0",
                    "on-tertiary-container": "#f0959d",
                    "on-error-container": "#93000a",
                    "tertiary": "#531620",
                    "on-tertiary": "#ffffff",
                    "secondary-container": "#cdead0",
                    "on-tertiary-fixed-variant": "#753139",
                    "surface-tint": "#296b40"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "1rem",
                    "xl": "1.5rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Manrope"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        }
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .editorial-shadow {
            box-shadow: 0 24px 48px -12px rgba(25, 29, 25, 0.06);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface min-h-screen">
<!-- Top Navigation Anchor -->
<header class="w-full sticky top-0 z-50 bg-[#f8faf4] dark:bg-[#191d19] flex justify-between items-center px-6 py-4">
<div class="flex items-center gap-4">
<button class="text-[#003418] dark:text-[#f8faf4] active:scale-95 duration-150 p-2">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-['Manrope'] font-bold text-lg tracking-tight text-[#003418] dark:text-[#f8faf4]">Emerald Courier</h1>
</div>
<div class="w-10 h-10 rounded-full overflow-hidden bg-surface-container-high">
<img alt="User Profile" data-alt="Close up portrait of a professional man with a kind smile in high-end studio lighting with a neutral background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA1HAyZoQH5tt9PPXbdP717MlmkU-I8voImnxmN466eLdCCmjEoJCODX2jwJUhZLvKXBxr3NFPbXfVp0e6nMwtD5g8NrRh1CWe7i30abO_kgrsuIyxa4r2XyeDa1xaF1jnVkrigwIg4kIegeYnOnN278FY-nBFXj4psEFOnw8lUm8-iEnwXAUyfWnVYhvH1-AThGE8cHA1rfvaJ45BEzRVJvFb9gh3S1qFxLwnuExKB9zWsFs2PDZBlcZL2-2OHwh_ux1rdNl37b_o"/>
</div>
</header>
<main class="max-w-xl mx-auto px-6 pt-8 pb-32">
<!-- Order Identification Section -->
<section class="mb-10 text-center">
<p class="font-headline font-extrabold text-[#003418] italic text-2xl mb-2">Delivery Completed</p>
<p class="text-on-surface-variant font-medium">Order #EC-8821 • Arrived 2 mins ago</p>
</section>
<!-- Rider Profile Card -->
<div class="bg-surface-container-lowest editorial-shadow rounded-xl p-6 mb-8 flex flex-col items-center">
<div class="relative mb-4">
<img alt="Rider Portrait" class="w-24 h-24 rounded-full object-cover border-4 border-surface" data-alt="Professional delivery person portrait with a friendly expression wearing a dark green polo shirt in soft daylight" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCBi-9ZVjuxXfyH7baHMDvhGJU-6UQyeCA_3eu8K39AZl3qf6PqfWcf-h6sDBE29B_CjuGCo8xzJVPdiFbcyoEbwyYsv0oY38wZZGLnWl1BwZ2-M3nHlCDJXc3yOMnIYLD1AUxLy2i4GLFA9wXeEtJKyPBs86Mf_EL5F8yox5igoONqSPiyX-YblRGEApinvxwhlsH5ECLm-VMkeEmtkpchDzA-1twFcxXZrrDUw7IV6L7HpG6rmNp11ZDoL5j7vSWBKuxCdmKYxPA"/>
<div class="absolute bottom-0 right-0 bg-primary p-1.5 rounded-full border-2 border-surface">
<span class="material-symbols-outlined text-white text-sm" style="font-variation-settings: 'FILL' 1;">verified</span>
</div>
</div>
<h2 class="font-headline font-bold text-xl text-on-surface">Marcus Chen</h2>
<p class="text-on-surface-variant text-sm mb-6">Platinum Courier • 4,200+ Deliveries</p>
<!-- Star Rating Component -->
<div class="flex gap-2 mb-2">
<button class="text-[#004d26] transition-all active:scale-90"><span class="material-symbols-outlined text-4xl" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span></button>
<button class="text-[#004d26] transition-all active:scale-90"><span class="material-symbols-outlined text-4xl" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span></button>
<button class="text-[#004d26] transition-all active:scale-90"><span class="material-symbols-outlined text-4xl" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span></button>
<button class="text-[#004d26] transition-all active:scale-90"><span class="material-symbols-outlined text-4xl" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span></button>
<button class="text-outline-variant transition-all active:scale-90"><span class="material-symbols-outlined text-4xl" data-icon="star">star</span></button>
</div>
<p class="text-on-surface-variant font-medium text-sm">Tap to rate your experience</p>
</div>
<!-- Tipping Section -->
<section class="mb-10">
<h3 class="font-headline font-bold text-on-surface mb-4">Add a tip for Marcus</h3>
<div class="grid grid-cols-4 gap-3">
<button class="py-4 rounded-xl bg-surface-container-high font-bold text-on-surface hover:bg-primary hover:text-white transition-all active:scale-95 duration-150">$1</button>
<button class="py-4 rounded-xl bg-surface-container-high font-bold text-on-surface hover:bg-primary hover:text-white transition-all active:scale-95 duration-150">$2</button>
<button class="py-4 rounded-xl bg-primary text-white font-bold transition-all active:scale-95 duration-150 shadow-lg">$5</button>
<button class="py-4 rounded-xl bg-surface-container-high font-bold text-on-surface hover:bg-primary hover:text-white transition-all active:scale-95 duration-150">Custom</button>
</div>
<p class="text-[11px] text-on-surface-variant mt-3 text-center uppercase tracking-widest font-medium">100% of tips go to your courier</p>
</section>
<!-- Feedback Comments -->
<section class="mb-10">
<div class="flex justify-between items-end mb-4">
<h3 class="font-headline font-bold text-on-surface">Any specific feedback?</h3>
<span class="text-on-surface-variant text-xs">Optional</span>
</div>
<div class="bg-surface-container-low rounded-xl p-4 focus-within:bg-surface-container-lowest transition-all group border border-transparent focus-within:border-primary/20">
<textarea class="w-full bg-transparent border-none focus:ring-0 text-on-surface placeholder:text-outline p-0 resize-none min-h-[120px]" placeholder="Marcus was careful with the fragile items and arrived earlier than expected..."></textarea>
</div>
<!-- Quick Chips for Feedback -->
<div class="flex flex-wrap gap-2 mt-4">
<button class="px-4 py-2 rounded-full bg-surface-container-high text-on-surface text-sm font-medium hover:bg-secondary-fixed transition-colors">Fast delivery</button>
<button class="px-4 py-2 rounded-full bg-surface-container-high text-on-surface text-sm font-medium hover:bg-secondary-fixed transition-colors">Friendly</button>
<button class="px-4 py-2 rounded-full bg-surface-container-high text-on-surface text-sm font-medium hover:bg-secondary-fixed transition-colors">Above &amp; beyond</button>
<button class="px-4 py-2 rounded-full bg-surface-container-high text-on-surface text-sm font-medium hover:bg-secondary-fixed transition-colors">Good handling</button>
</div>
</section>
<!-- Action Button -->
<button class="w-full py-5 rounded-xl bg-gradient-to-br from-[#003418] to-[#004d26] text-white font-headline font-bold text-lg shadow-xl active:scale-[0.98] transition-transform">
            Submit Review
        </button>
</main>
<!-- Navigation suppressed for transactional focus -->
<!-- Toast Notification (Semantic Shell Concept) -->
<div class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[90%] max-w-sm">
<div class="bg-[#191d19]/90 backdrop-blur-md text-[#f8faf4] px-5 py-3 rounded-xl flex items-center gap-3 shadow-2xl">
<span class="material-symbols-outlined text-primary-fixed" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<p class="text-sm font-medium">Reviewing Marcus Chen</p>
</div>
</div>
</body></html>
