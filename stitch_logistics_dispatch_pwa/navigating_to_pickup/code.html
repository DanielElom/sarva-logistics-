<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface": "#f8faf4",
                    "on-tertiary": "#ffffff",
                    "on-error": "#ffffff",
                    "on-background": "#191d19",
                    "outline-variant": "#c0c9be",
                    "surface-bright": "#f8faf4",
                    "tertiary-container": "#6f2c35",
                    "tertiary-fixed": "#ffdadb",
                    "secondary-fixed": "#cdead0",
                    "inverse-on-surface": "#eff2eb",
                    "inverse-surface": "#2e312d",
                    "tertiary-fixed-dim": "#ffb2b8",
                    "primary-container": "#004d26",
                    "on-tertiary-fixed-variant": "#753139",
                    "on-secondary-fixed-variant": "#344c39",
                    "secondary": "#4b6450",
                    "on-error-container": "#93000a",
                    "secondary-container": "#cdead0",
                    "surface-container": "#ecefe8",
                    "secondary-fixed-dim": "#b2ceb5",
                    "background": "#f8faf4",
                    "on-primary": "#ffffff",
                    "outline": "#707970",
                    "error": "#ba1a1a",
                    "primary-fixed": "#adf2bc",
                    "on-secondary-container": "#516a56",
                    "error-container": "#ffdad6",
                    "surface-container-highest": "#e0e3dd",
                    "on-secondary-fixed": "#082010",
                    "inverse-primary": "#92d6a2",
                    "on-tertiary-container": "#f0959d",
                    "on-surface": "#191d19",
                    "on-primary-container": "#7abd8b",
                    "surface-dim": "#d8dbd5",
                    "surface-container-low": "#f2f4ee",
                    "on-tertiary-fixed": "#3d0511",
                    "surface-variant": "#e0e3dd",
                    "on-primary-fixed": "#00210d",
                    "on-surface-variant": "#404941",
                    "tertiary": "#531620",
                    "surface-tint": "#296b40",
                    "on-secondary": "#ffffff",
                    "surface-container-high": "#e6e9e3",
                    "on-primary-fixed-variant": "#08522a",
                    "primary": "#003418",
                    "surface-container-lowest": "#ffffff",
                    "primary-fixed-dim": "#92d6a2"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Manrope"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        }
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-glass {
            background: rgba(248, 250, 244, 0.85);
            backdrop-filter: blur(16px);
        }
        .editorial-shadow {
            box-shadow: 0 24px 48px -12px rgba(25, 29, 25, 0.08);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface antialiased overflow-hidden">
<!-- Top Navigation Anchor -->
<header class="fixed top-0 w-full z-50 bg-emerald-950/80 dark:bg-emerald-950/90 backdrop-blur-lg shadow-xl shadow-emerald-950/20 flex justify-between items-center px-6 h-16 w-full">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-white">menu</span>
<span class="text-lg font-extrabold tracking-tighter text-emerald-50">Delivery Hub</span>
</div>
<div class="h-10 w-10 rounded-full bg-emerald-800 flex items-center justify-center overflow-hidden border border-emerald-700/50">
<img alt="Rider Profile" class="w-full h-full object-cover" data-alt="Close-up portrait of a professional courier rider with a friendly expression wearing a dark green technical jacket" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAG62jf9sPbD4te5G4dpuo4gwMjmkVLfuZDnjB2FaeE1Omc2JktgCBD-oUZjnoy90b_Z4X395mLWIHb8Qet77oNFgrHOexFwyVbv6SinNLDa8-VXEPowcyGjMZeDv_b6Rzsgp3IRaMQHNDF4CdQon5sKBi3agxDE7Ro0G8NRcNe5Ic7YrG1BE-30KBSyyDK4zfCCIIgP6zJtBZ_Rp9Y2WV24sbn569jhHbSjcZX8RBxvkBgRFeL8yE9xRkXlwtHcyQOzjJbIic0iqE"/>
</div>
</header>
<!-- Main Map Canvas -->
<main class="relative h-screen w-full pt-16 pb-20">
<!-- Interactive Map Background -->
<div class="absolute inset-0 z-0">
<img class="w-full h-screen object-cover grayscale-[0.2] contrast-[1.1]" data-alt="Detailed top-down satellite 3D map view of urban city streets with a highlighted green navigation path and traffic indicators" data-location="London, UK" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDHOKl6994QrEMyM8JMWE40wzBfsJ6uaN3PGLWMD2AAypi5depjqPLydX4e6p3o-0cZRDWhFNfkBLe8UtJ7-RTed1CsyRIQsiu_nxzYbZfh1K2bPCHis1r3M4ULWaB-3lCOr44GwW2y9S4kXvx9wxZOfl_9P5_kYE19qlFQQOsOb0KMi2KKZR4tXPHVtf1hUyylcd-sbKhXqupXIkOP-PsRQ0d2TUczjJQt40HL_lwC9dH-zL5_ggs5nm-dau3LcNiBq_gSLpFDTKo"/>
<!-- Map Overlay UI Elements -->
<div class="absolute inset-0 bg-gradient-to-b from-primary/10 to-transparent pointer-events-none"></div>
<!-- Navigation Indicator -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none">
<div class="relative flex items-center justify-center">
<div class="absolute w-24 h-24 bg-primary/20 rounded-full animate-pulse"></div>
<div class="w-8 h-8 bg-primary rounded-full border-4 border-white shadow-lg flex items-center justify-center">
<span class="material-symbols-outlined text-white text-sm" style="font-variation-settings: 'FILL' 1;">navigation</span>
</div>
</div>
</div>
</div>
<!-- Floating Action Buttons Layer -->
<div class="absolute right-6 bottom-56 flex flex-col gap-4 z-40">
<button class="w-14 h-14 bg-surface-container-lowest text-primary rounded-full shadow-2xl flex items-center justify-center active:scale-95 transition-transform editorial-shadow">
<span class="material-symbols-outlined" data-icon="call">call</span>
</button>
<button class="w-14 h-14 bg-primary text-on-primary rounded-full shadow-2xl flex items-center justify-center active:scale-95 transition-transform editorial-shadow">
<span class="material-symbols-outlined" data-icon="chat">chat</span>
</button>
</div>
<!-- Direction Turn-by-Turn Overlay -->
<div class="absolute top-20 left-6 right-6 z-40">
<div class="bg-primary bg-gradient-to-br from-primary to-primary-container p-5 rounded-2xl flex items-center gap-4 shadow-2xl shadow-primary/30">
<div class="bg-white/10 p-3 rounded-xl backdrop-blur-md">
<span class="material-symbols-outlined text-white text-3xl">turn_slight_right</span>
</div>
<div class="flex-1">
<p class="text-white/70 text-xs font-semibold tracking-widest uppercase font-label">300 meters</p>
<h2 class="text-white font-headline text-lg font-extrabold leading-tight">Turn right onto Baker St.</h2>
</div>
</div>
</div>
<!-- Bottom Sheet Information -->
<div class="absolute bottom-0 w-full z-40 px-4 pb-8">
<div class="bg-glass rounded-[2.5rem] p-6 editorial-shadow flex flex-col gap-6 max-w-2xl mx-auto border border-white/40">
<!-- Trip Summary -->
<div class="flex justify-between items-start">
<div class="space-y-1">
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-primary"></span>
<p class="text-on-surface-variant font-label text-sm font-semibold tracking-tight">Navigating to Pickup</p>
</div>
<h3 class="font-headline text-3xl font-extrabold text-on-surface">8 mins <span class="text-on-surface-variant text-lg font-medium">· 2.4 km</span></h3>
</div>
<div class="text-right">
<p class="text-on-surface-variant text-xs font-bold uppercase tracking-wider mb-1">Arrival Time</p>
<p class="text-primary font-headline text-xl font-bold">14:32</p>
</div>
</div>
<!-- Customer Info -->
<div class="flex items-center gap-4 p-4 bg-surface-container-low rounded-2xl border border-outline-variant/10">
<div class="w-12 h-12 bg-surface-container-highest rounded-xl flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant">person_pin_circle</span>
</div>
<div class="flex-1">
<p class="text-on-surface text-sm font-bold">The Golden Spoon Restaurant</p>
<p class="text-on-surface-variant text-xs font-medium">42 Marylebone High St, London</p>
</div>
<button class="bg-surface-container-highest text-on-surface text-xs font-bold px-4 py-2 rounded-full">
                        Details
                    </button>
</div>
<!-- Primary Action & Cancel -->
<div class="flex flex-col gap-4">
<button class="w-full bg-primary bg-gradient-to-br from-primary to-primary-container text-white py-5 rounded-2xl font-headline font-bold text-lg shadow-lg active:scale-[0.98] transition-transform">
                        Arrived at Pickup
                    </button>
<button class="w-full text-error font-label text-sm font-bold py-2 hover:bg-error/5 transition-colors rounded-lg">
                        Cancel Trip
                    </button>
</div>
</div>
</div>
</main>
<!-- Navigation Shell Placeholder (Suppressed for focused journey) -->
<!-- The BottomNavBar is suppressed here as the journey is a "focused" task-specific screen -->
</body></html>
