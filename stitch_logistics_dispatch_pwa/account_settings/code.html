<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#516a56",
                        "error-container": "#ffdad6",
                        "surface-variant": "#e0e3dd",
                        "on-background": "#191d19",
                        "surface-dim": "#d8dbd5",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed": "#3d0511",
                        "primary": "#003418",
                        "on-primary-container": "#7abd8b",
                        "on-secondary-fixed": "#082010",
                        "on-primary-fixed": "#00210d",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#adf2bc",
                        "surface-container-low": "#f2f4ee",
                        "secondary": "#4b6450",
                        "tertiary": "#531620",
                        "inverse-primary": "#92d6a2",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#cdead0",
                        "primary-container": "#004d26",
                        "on-primary-fixed-variant": "#08522a",
                        "tertiary-fixed-dim": "#ffb2b8",
                        "on-surface": "#191d19",
                        "on-tertiary-fixed-variant": "#753139",
                        "inverse-on-surface": "#eff2eb",
                        "inverse-surface": "#2e312d",
                        "surface-container": "#ecefe8",
                        "on-tertiary": "#ffffff",
                        "surface": "#f8faf4",
                        "tertiary-fixed": "#ffdadb",
                        "background": "#f8faf4",
                        "surface-container-lowest": "#ffffff",
                        "on-primary": "#ffffff",
                        "tertiary-container": "#6f2c35",
                        "surface-container-high": "#e6e9e3",
                        "surface-bright": "#f8faf4",
                        "primary-fixed-dim": "#92d6a2",
                        "on-tertiary-container": "#f0959d",
                        "outline": "#707970",
                        "error": "#ba1a1a",
                        "outline-variant": "#c0c9be",
                        "secondary-fixed": "#cdead0",
                        "surface-tint": "#296b40",
                        "on-surface-variant": "#404941",
                        "surface-container-highest": "#e0e3dd",
                        "secondary-fixed-dim": "#b2ceb5",
                        "on-secondary-fixed-variant": "#344c39"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Manrope', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 right-0 z-50 bg-white/80 dark:bg-emerald-950/80 backdrop-blur-md shadow-sm shadow-emerald-900/5">
<div class="flex justify-between items-center w-full px-6 py-4">
<div class="flex items-center gap-4">
<button class="text-emerald-900 dark:text-emerald-50 active:scale-95 duration-200">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-manrope font-bold text-lg tracking-tight text-emerald-900 dark:text-emerald-50">Operational Control</h1>
</div>
<button class="text-emerald-900 dark:text-emerald-50 hover:bg-emerald-50/50 dark:hover:bg-emerald-900/50 transition-colors rounded-full p-1">
<span class="material-symbols-outlined">account_circle</span>
</button>
</div>
</header>
<main class="pt-24 px-6 max-w-2xl mx-auto">
<!-- Profile Header Section -->
<section class="mb-10 text-center md:text-left flex flex-col md:flex-row items-center gap-6 p-6 bg-surface-container-lowest rounded-xl shadow-sm">
<div class="relative">
<div class="w-24 h-24 rounded-full overflow-hidden border-4 border-primary-fixed">
<img alt="Rider #4902" class="w-full h-full object-cover" data-alt="professional portrait of a confident delivery courier in a dark green uniform with soft natural lighting and blurred urban background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD6WTFy1f-CuUvuH-wPKp5FQAy6VF0J4ioN4p2jDV-I2C9E0vd-5FeW-m1HjPfk_8spv08IK4am1bugNhlFb8jUQJj6Koa8SuC2jR5XjAVs4XmiVJ1mWJ3Fe5n9hhcI5u89Slwu2fuuYlaIS8NcgfsGdxkG-9kzJsMUiozQQHyFRybe3MsERJ0RwSL5OieEDueOP5_69JnNFKjyTNgXhOEfycJZOcgsR3NeTDooUP0Jr5L38VnNDJpBhMqlq_iSG87Tz7Hu14XUhjA"/>
</div>
<div class="absolute bottom-0 right-0 bg-primary text-white p-1 rounded-full border-2 border-surface">
<span class="material-symbols-outlined text-xs" style="font-variation-settings: 'FILL' 1;">verified</span>
</div>
</div>
<div class="flex-1">
<h2 class="text-2xl font-extrabold text-primary tracking-tight">Rider #4902</h2>
<p class="text-on-surface-variant font-medium">Emerald Courier Elite</p>
<div class="flex items-center justify-center md:justify-start gap-2 mt-2">
<span class="inline-block w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="text-xs font-semibold text-primary uppercase tracking-widest">Status: Online</span>
</div>
</div>
</section>
<!-- Core Documentation Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-10">
<!-- Bento Item: My Documents -->
<button class="group flex flex-col items-start p-6 bg-surface-container-low rounded-xl text-left transition-all hover:bg-surface-container-lowest hover:shadow-md active:scale-[0.98]">
<div class="bg-primary-container p-3 rounded-lg text-on-primary-container mb-4 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined">assignment_ind</span>
</div>
<h3 class="font-bold text-lg mb-1">My Documents</h3>
<p class="text-sm text-on-surface-variant leading-relaxed">License, insurance, and personal registration papers.</p>
<span class="mt-4 text-xs font-bold text-primary flex items-center gap-1">Update Files <span class="material-symbols-outlined text-sm">arrow_forward</span></span>
</button>
<!-- Bento Item: Bike Documentation -->
<button class="group flex flex-col items-start p-6 bg-surface-container-low rounded-xl text-left transition-all hover:bg-surface-container-lowest hover:shadow-md active:scale-[0.98]">
<div class="bg-secondary-container p-3 rounded-lg text-on-secondary-container mb-4 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined">motorcycle</span>
</div>
<h3 class="font-bold text-lg mb-1">Bike Documentation</h3>
<p class="text-sm text-on-surface-variant leading-relaxed">Vehicle permits, maintenance logs, and pollution checks.</p>
<span class="mt-4 text-xs font-bold text-secondary flex items-center gap-1">Review Compliance <span class="material-symbols-outlined text-sm">arrow_forward</span></span>
</button>
</div>
<!-- Portal Link -->
<section class="mb-12">
<button class="w-full flex items-center justify-between p-5 bg-primary rounded-xl text-white shadow-lg shadow-primary/20 hover:opacity-90 active:scale-[0.99] transition-all">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined">speed</span>
<div class="text-left">
<p class="font-bold">Rider Portal</p>
<p class="text-white/70 text-xs">Access payroll, shifts, and regional stats</p>
</div>
</div>
<span class="material-symbols-outlined">open_in_new</span>
</button>
</section>
<!-- Destructive Actions -->
<section class="space-y-3 pt-6 border-t border-outline-variant/20">
<h4 class="text-xs font-bold text-on-surface-variant uppercase tracking-widest px-1 mb-4">Account Management</h4>
<button class="w-full flex items-center justify-between p-4 bg-surface-container-high rounded-xl text-on-surface hover:bg-surface-container-highest transition-colors active:scale-[0.99]">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-error">logout</span>
<span class="font-semibold">Log Out</span>
</div>
</button>
<button class="w-full flex items-center justify-between p-4 bg-error-container/30 rounded-xl text-error hover:bg-error-container/50 transition-colors active:scale-[0.99]">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined">delete_forever</span>
<span class="font-semibold">Permanently Delete Account</span>
</div>
<span class="material-symbols-outlined text-sm">chevron_right</span>
</button>
</section>
</main>
<!-- NavigationDrawer (Mobile/Desktop Context) -->
<!-- Represented conceptually through the active UI but using BottomNavBar for the PWA requirement -->
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full bg-white/80 dark:bg-emerald-950/80 backdrop-blur-md rounded-t-2xl z-50 shadow-[0_-4px_24px_rgba(0,52,24,0.06)]">
<div class="flex justify-around items-center px-4 pb-6 pt-3">
<a class="flex flex-col items-center justify-center text-emerald-900/50 dark:text-emerald-50/50 px-4 py-2 hover:bg-emerald-100/50 transition-all active:scale-90" href="#">
<span class="material-symbols-outlined">assignment</span>
<span class="font-inter text-[11px] font-semibold uppercase tracking-wider mt-1">Tasks</span>
</a>
<a class="flex flex-col items-center justify-center text-emerald-900/50 dark:text-emerald-50/50 px-4 py-2 hover:bg-emerald-100/50 transition-all active:scale-90" href="#">
<span class="material-symbols-outlined">payments</span>
<span class="font-inter text-[11px] font-semibold uppercase tracking-wider mt-1">Earnings</span>
</a>
<a class="flex flex-col items-center justify-center text-emerald-900/50 dark:text-emerald-50/50 px-4 py-2 hover:bg-emerald-100/50 transition-all active:scale-90" href="#">
<span class="material-symbols-outlined">star</span>
<span class="font-inter text-[11px] font-semibold uppercase tracking-wider mt-1">Ratings</span>
</a>
<!-- Active State: Settings mapping to Schedule or logical account home -->
<a class="flex flex-col items-center justify-center bg-emerald-900 dark:bg-emerald-800 text-white rounded-xl px-4 py-2 active:scale-90" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="font-inter text-[11px] font-semibold uppercase tracking-wider mt-1">Profile</span>
</a>
</div>
</nav>
</body></html>
