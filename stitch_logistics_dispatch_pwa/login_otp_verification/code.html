<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .editorial-shadow {
            box-shadow: 0 24px 48px -12px rgba(0, 52, 24, 0.08);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface font-body text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar (Suppressed destination shell logic for transactional screens, but using it as a back-header) -->
<header class="w-full top-0 sticky bg-[#f8faf4] dark:bg-[#191d19] flex items-center justify-between px-6 h-16 w-full z-50">
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-[#e6e9e3] dark:hover:bg-[#2a2f29] transition-colors duration-200 active:scale-95 transition-transform rounded-full">
<span class="material-symbols-outlined text-[#003418] dark:text-[#f8faf4]">arrow_back</span>
</button>
<span class="text-lg font-extrabold tracking-tighter text-[#003418] dark:text-[#f8faf4] font-headline">The Architectural Courier</span>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-6 py-12">
<div class="max-w-md w-full">
<!-- Hero Aesthetic Section -->
<div class="mb-12 relative">
<div class="aspect-square w-24 h-24 bg-gradient-to-br from-primary to-primary-container rounded-xl flex items-center justify-center mb-8 editorial-shadow overflow-hidden">
<span class="material-symbols-outlined text-on-primary text-4xl" style="font-variation-settings: 'FILL' 1;">shield_person</span>
</div>
<h1 class="text-4xl font-headline font-extrabold tracking-tight text-on-surface mb-3 leading-tight">
                    Verify Identity
                </h1>
<p class="text-on-surface-variant font-body leading-relaxed max-w-xs">
                    We've sent a code to your registered device. Please enter the 6-digit signature.
                </p>
</div>
<!-- Verification Form Card -->
<div class="bg-surface-container-lowest rounded-xl p-8 editorial-shadow">
<form class="space-y-10">
<!-- OTP Input Cluster -->
<div class="flex justify-between items-center gap-2">
<!-- Single Digit Inputs -->
<input class="w-12 h-16 text-center text-2xl font-headline font-bold bg-surface-container-low border-none rounded-lg focus:ring-1 focus:ring-primary transition-all duration-200" maxlength="1" placeholder="·" type="text"/>
<input class="w-12 h-16 text-center text-2xl font-headline font-bold bg-surface-container-low border-none rounded-lg focus:ring-1 focus:ring-primary transition-all duration-200" maxlength="1" placeholder="·" type="text"/>
<input class="w-12 h-16 text-center text-2xl font-headline font-bold bg-surface-container-low border-none rounded-lg focus:ring-1 focus:ring-primary transition-all duration-200" maxlength="1" placeholder="·" type="text"/>
<div class="w-2 h-0.5 bg-outline-variant rounded-full mx-1"></div>
<input class="w-12 h-16 text-center text-2xl font-headline font-bold bg-surface-container-low border-none rounded-lg focus:ring-1 focus:ring-primary transition-all duration-200" maxlength="1" placeholder="·" type="text"/>
<input class="w-12 h-16 text-center text-2xl font-headline font-bold bg-surface-container-low border-none rounded-lg focus:ring-1 focus:ring-primary transition-all duration-200" maxlength="1" placeholder="·" type="text"/>
<input class="w-12 h-16 text-center text-2xl font-headline font-bold bg-surface-container-low border-none rounded-lg focus:ring-1 focus:ring-primary transition-all duration-200" maxlength="1" placeholder="·" type="text"/>
</div>
<div class="space-y-6">
<button class="w-full h-14 rounded-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-headline font-bold text-lg tracking-wide shadow-lg hover:brightness-110 active:scale-95 transition-all duration-200" type="submit">
                            Login
                        </button>
<div class="flex flex-col items-center gap-4 pt-4">
<p class="text-on-surface-variant text-sm font-label uppercase tracking-widest">
                                Didn't receive the code?
                            </p>
<button class="group flex items-center gap-2 text-primary font-bold font-headline hover:gap-3 transition-all duration-300" type="button">
                                Resend Code
                                <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
</div>
</form>
</div>
<!-- Footer Meta -->
<div class="mt-12 text-center">
<div class="inline-flex items-center gap-2 px-4 py-2 bg-surface-container-low rounded-full">
<span class="w-2 h-2 bg-primary rounded-full animate-pulse"></span>
<span class="text-xs font-label uppercase tracking-tighter text-on-surface-variant">System Secured by Courier Shield</span>
</div>
</div>
</div>
</main>
<!-- Decorative Background Asset -->
<div class="fixed bottom-0 right-0 -z-10 opacity-10 pointer-events-none transform translate-y-1/4 translate-x-1/4">
<div class="w-[600px] h-[600px] rounded-full bg-gradient-to-br from-primary to-transparent blur-3xl"></div>
</div>
