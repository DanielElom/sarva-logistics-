[build]
builder = "nixpacks"
buildCommand = "pnpm install && pnpm build"

[deploy]
startCommand = "npx prisma migrate deploy && node scripts/seed-if-empty.js && node dist/src/main.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[environments.production.variables]
NODE_ENV = "production"
PORT = "3001"
NODE_VERSION = "20"
