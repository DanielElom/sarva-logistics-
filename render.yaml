services:
  - type: web
    name: sarva-backend
    runtime: node
    region: frankfurt
    rootDir: backend
    buildCommand: corepack enable && corepack prepare pnpm@latest --activate && pnpm install && pnpm build
    startCommand: npx prisma migrate deploy || true && node scripts/seed-if-empty.js || true && node dist/src/main.js
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://sarva.vercel.app  # UPDATE after Vercel deploy
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: AFRICAS_TALKING_API_KEY
        sync: false
      - key: AFRICAS_TALKING_USERNAME
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: OPAY_SECRET_KEY
        sync: false
      - key: OPAY_MERCHANT_ID
        sync: false
      - key: FCM_SERVER_KEY
        sync: false
